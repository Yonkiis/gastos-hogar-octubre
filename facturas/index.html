<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Facturas del mes</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<div id="appVersion">FACTURAS · V50</div>
<header><div><h1>Facturas del mes</h1><p>Control de servicios, vencimientos y pagos</p></div><button id="uploadTop">+ Cargar factura</button></header>
<main>
<section class="toolbar"><button id="prevMonth">‹</button><div><b id="monthTitle"></b><input id="monthPicker" type="month"></div><button id="nextMonth">›</button></section>
<section class="cards">
<div><span>Total del mes</span><strong id="totalAmount">$0</strong></div><div><span>Pagadas</span><strong id="paidAmount">$0</strong></div><div><span>Pendientes</span><strong id="pendingAmount">$0</strong></div><div><span>Próximos vencimientos</span><strong id="upcomingCount">0</strong></div>
</section>
<section class="panel"><div class="panelHead"><h2>Facturas</h2><button id="uploadBtn">+ Cargar factura</button></div><div id="billList" class="list"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modalBox">
<div class="modalHead"><h2 id="modalTitle">Nueva factura</h2><button id="closeModal">×</button></div>
<div id="dropzone" class="dropzone"><b>Subí la factura</b><span>PDF o imagen · el sistema intentará completar los datos automáticamente</span><input id="fileInput" type="file" accept=".pdf,image/*"></div>
<div id="ocrStatus" class="reading hidden"></div><div id="ocrPanel" class="analysisPanel hidden"></div><div id="invoicePreview" class="invoicePreview hidden"></div>
<div class="formgrid">
<label>Servicio<select id="service"><option>Luz</option><option>Gas</option><option>Agua</option><option>Internet</option><option>Seguro de auto</option><option>Alquiler</option><option>ARBA departamento</option><option>ARBA cochera</option><option>Municipal</option><option>Municipal cochera</option><option>Expensas</option><option>Otro</option></select></label>
<label>Empresa<input id="company"></label><label>N° de factura<input id="invoiceNumber"></label><label>Importe<input id="amount" inputmode="decimal" placeholder="$0,00"></label>
<label>Fecha de emisión<input id="issueDate" type="date"></label><label>Vencimiento<input id="dueDate" type="date"></label><label>N° cliente/cuenta<input id="accountNumber"></label>
<label>Período desde<input id="periodStart" type="date"></label><label>Período hasta<input id="periodEnd" type="date"></label><label class="wide">Titular<input id="holderName"></label>
<label>Estado<select id="status"><option>Pendiente</option><option>Pagada</option></select></label>
</div>
<div class="paymentBox"><b>Pago</b><div class="formgrid paymentGrid">
<label>Fecha de pago<input id="paymentDate" type="date"></label><label>Importe pagado<input id="paymentAmount" inputmode="decimal" placeholder="$0,00"></label>
<label>Medio de pago<select id="paymentMethod"><option value="">Seleccionar</option><option>Transferencia</option><option>Mercado Pago</option><option>Débito</option><option>Crédito</option><option>Efectivo</option><option>Otro</option></select></label>
<label>Comprobante<input id="receiptInput" type="file" accept=".pdf,image/*"></label></div></div>
<div id="fileInfo" class="fileInfo"></div><div class="actions"><button class="secondary" id="cancelBtn">Cancelar</button><button id="saveBtn">Guardar factura</button></div>
</div></div>
<div id="viewModal" class="modal hidden"><div class="modalBox small"><div class="modalHead"><h2>Documento</h2><button id="closeView">×</button></div><iframe id="viewer" title="Documento"></iframe></div></div>
<script type="module" src="app.js?v=50"></script>
</body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gastos compartidos</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#202b3c}.wrap{max-width:900px;margin:auto;padding:24px}.panel,.auth{background:#fff;padding:20px;margin:15px 0;border:1px solid #ddd;border-radius:12px}h1,h2{color:#183153}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}.btn{padding:11px 16px;background:#183153;color:#fff;border:0;border-radius:8px;font-weight:bold}.expense{padding:14px;border:1px solid #ddd;border-radius:10px;margin:10px 0;background:#fff}.top{display:flex;justify-content:space-between}.detail{margin-top:7px;font-weight:bold}.meta{margin-top:6px;color:#687386;font-size:13px}.delete{margin-top:9px}.hide{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><section id="login" class="auth"><h1>Gastos compartidos</h1><form id="loginForm"><div class="field"><label>Correo</label><input id="email" type="email" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" required></div><button class="btn">Iniciar sesión</button></form><div id="loginMsg"></div></section><main id="app" class="wrap hide"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Gastos de octubre</h1><p>Lista compartida</p></div><div>Octubre 2026 · v3.0 <button id="logout" class="delete">Salir</button></div></div><section class="panel"><h2>Ingresos del hogar</h2><form id="incomeForm"><div class="grid"><div class="field"><label>Sueldo Toto</label><input id="totoIncome" inputmode="numeric" placeholder="$1.000.000"></div><div class="field"><label>Sueldo Rocío</label><input id="rocioIncome" inputmode="numeric" placeholder="$1.000.000"></div></div><p><button class="btn">Guardar ingresos</button></p></form><div id="incomeMsg"></div></section><section class="panel"><h2>Agregar gasto de octubre</h2><form id="expenseForm"><div class="grid"><div class="field"><label>Fecha</label><input id="date" type="date" min="2026-10-01" max="2026-10-31" required></div><div class="field"><label>Categoría</label><select id="category"><option>Supermercado</option><option>Limpieza</option><option>Gastos extra</option><option>Otro</option></select></div><div class="field"><label>Importe</label><input id="amount" inputmode="numeric" placeholder="$1.000.000" required></div><div class="field"><label>Detalle</label><input id="detail" placeholder="Ej.: Compramos carne"></div><div class="field"><label>Pagó</label><select id="paidBy"><option>Rocío</option><option>Toto</option></select></div></div><p><button class="btn">Agregar gasto</button></p></form><div id="expenseMsg"></div></section><section class="panel"><h2>Gastos cargados en octubre <span id="count"></span></h2><div id="list"></div><hr><b>Total: <span id="total">$ 0</span></b></section></main><script src="./supabase.js?v=5"></script><script>
const db=window.supabase.createClient('https://xnexfqbcxvrloirhrteo.supabase.co','sb_publishable_S50gnzXMiYfh0O3IyqM6DQ_Kjqvdhlp',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gastos-hogar-v3'}});
let expenses=[];const month='2026-10';const money=n=>'
async function load(){const r=await db.from('household_expenses').select('*').gte('expense_date','2026-10-01').lte('expense_date','2026-10-31').order('created_at',{ascending:true});if(r.error){document.getElementById('expenseMsg').textContent=r.error.message;return}expenses=r.data||[];render()}
function render(){const list=document.getElementById('list');list.innerHTML='';let total=0;expenses.forEach(x=>{total+=Number(x.amount);const d=document.createElement('div');d.className='expense';const top=document.createElement('div');top.className='top';const c=document.createElement('b');c.textContent=x.category;const a=document.createElement('b');a.textContent=money(x.amount);top.append(c,a);const detail=document.createElement('div');detail.className='detail';detail.textContent='Detalle: '+(x.description||'Sin detalle');const meta=document.createElement('div');meta.className='meta';meta.textContent=x.expense_date+' · Pagó: '+x.paid_by;const del=document.createElement('button');del.className='delete';del.textContent='Eliminar';del.onclick=async()=>{if(confirm('¿Eliminar?')){await db.from('household_expenses').delete().eq('id',x.id);load()}};d.append(top,detail,meta,del);list.append(d)});document.getElementById('count').textContent='('+expenses.length+')';document.getElementById('total').textContent=money(total)}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){loginMsg.textContent=r.error.message;return}show(r.data.session)};
function show(){login.classList.add('hide');app.classList.remove('hide');date.value='2026-10-01';load()}
logout.onclick=async()=>{await db.auth.signOut();location.reload()};
expenseForm.onsubmit=async e=>{e.preventDefault();const row={expense_date:date.value,category:category.value,description:detail.value.trim(),amount:parse(amount.value),paid_by:paidBy.value};const r=await db.from('household_expenses').insert(row).select('*').single();if(r.error){expenseMsg.textContent=r.error.message;return}expenses.push(r.data);render();amount.value='';detail.value='';expenseMsg.textContent='Gasto guardado correctamente.'};
incomeForm.onsubmit=async e=>{e.preventDefault();const r=await db.from('household_incomes').upsert({month_key:month,toto_income:parse(totoIncome.value),rocio_income:parse(rocioIncome.value),updated_at:new Date().toISOString()},{onConflict:'month_key'});incomeMsg.textContent=r.error?r.error.message:'Ingresos guardados correctamente.'};
['totoIncome','rocioIncome','amount'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',()=>{const digits=el.value.replace(/[^0-9]/g,'');el.value=digits?'

['totoIncome','rocioIncome','amount'].forEach(id=>{const el=document.getElementById(id);el.addEventListener('input',()=>{const digits=el.value.replace(/\D/g,'');el.value=digits?'$'+Number(digits).toLocaleString('es-AR'):''})});
</script></body></html>

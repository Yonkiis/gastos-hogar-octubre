<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gastos compartidos</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#202b3c;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:auto;padding:24px}
.panel,.auth{background:#fff;padding:20px;margin:15px 0;border:1px solid #ddd;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h1,h2{color:#183153}h1{margin:0 0 5px}h2{font-size:20px;margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-weight:bold;margin-bottom:6px}
.field input,.field select{width:100%;padding:13px;border:1px solid #bbb;border-radius:9px;background:#fff;font-size:16px;min-height:46px}
.btn{padding:12px 16px;background:#183153;color:#fff;border:0;border-radius:9px;font-weight:bold;font-size:15px;min-height:44px}
.expense{padding:14px;border:1px solid #ddd;border-radius:11px;margin:10px 0;background:#fff}
.top{display:flex;justify-content:space-between;gap:12px}.detail{margin-top:7px;font-weight:bold}
.meta{margin-top:6px;color:#687386;font-size:13px}.delete{margin-top:9px}.hide{display:none}
.summary{background:#eef4ff;border-radius:10px;padding:15px;margin-top:15px}
.balance{background:#fff4df;border:1px solid #e7c77d;border-radius:10px;padding:15px;margin-top:12px}
.ok{background:#eaf8ee;border-color:#9bd0aa}.line{display:flex;justify-content:space-between;margin:7px 0;gap:15px}
@media(max-width:650px){
 body{font-size:15px}
 .wrap{padding:10px}
 .panel,.auth{padding:15px;margin:10px 0;border-radius:12px}
 .wrap>div:first-child{padding:4px 2px}
 h1{font-size:25px}.panel h2{font-size:18px}
 .grid{grid-template-columns:1fr;gap:10px}
 .field input,.field select{min-height:48px}
 .btn{width:100%;min-height:46px}
 .top{align-items:flex-start}.top b{font-size:18px}
 .expense{padding:13px}
 .expense .btn,.expense .delete{width:auto;min-height:40px;padding:9px 12px}
 .line{display:flex;flex-direction:column;gap:2px;margin:9px 0}
 .line b{display:block}
 #logout{width:auto;margin-top:0}
 #monthForm{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
 #monthPicker{grid-column:1 / -1;grid-row:1;width:100%;min-height:48px}
 #prevMonth{grid-column:1;grid-row:2}
 #nextMonth{grid-column:2;grid-row:2}
}
</style>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#183153">
</head>
<body>
<section id="login" class="auth">
<h1>Gastos compartidos</h1>
<form id="loginForm">
<div class="field"><label>Correo</label><input id="email" type="email" required></div>
<div class="field"><label>Contraseña</label><input id="password" type="password" required></div>
<button class="btn">Iniciar sesión</button>
</form>
<div id="loginMsg"></div>
</section>

<main id="app" class="wrap hide">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<div><h1>Gastos compartidos</h1><p>Reparto proporcional según sueldo</p></div>
<div><button id="logout" class="delete">Salir</button></div>
</div>

<section class="panel">
<h2>Ingresos del hogar · <span id="monthTitle"></span></h2>
<form id="incomeForm">
<div class="grid">
<div class="field"><label>Sueldo Toto</label><input id="totoIncome" inputmode="numeric" placeholder="$1.000.000"></div>
<div class="field"><label>Sueldo Rocío</label><input id="rocioIncome" inputmode="numeric" placeholder="$1.000.000"></div>
</div>
<p><button class="btn">Guardar ingresos</button></p>
</form>
<div id="incomeMsg"></div>
<div id="incomeSummary" class="summary"></div><div id="balance" class="balance"></div>
</section>

<section class="panel">
<h2 id="expenseTitle">Agregar gasto</h2>
<form id="expenseForm">
<div class="grid">
<div class="field"><label>Fecha</label><input id="date" type="date" min="2026-10-01" max="2026-10-31" required></div>
<div class="field"><label>Categoría</label><select id="category"><option>Supermercado</option><option>Limpieza</option><option>Gastos extra</option><option>Otro</option></select></div>
<div class="field"><label>Importe</label><input id="amount" inputmode="numeric" placeholder="$1.000.000" required></div>
<div class="field"><label>Detalle</label><input id="detail" placeholder="Ej.: Compramos carne"></div>
<div class="field"><label>Pagó</label><select id="paidBy"><option>Rocío</option><option>Toto</option></select></div>
</div>
<p><button class="btn">Agregar gasto</button></p>
</form>
<div id="expenseMsg"></div>
</section>

<section id="editBox" class="panel hide">
<h2>Editar gasto</h2>
<form id="editForm">
<div class="grid">
<div class="field"><label>Fecha</label><input id="editDate" type="date" required></div>
<div class="field"><label>Categoría</label><select id="editCategory"><option>Supermercado</option><option>Limpieza</option><option>Gastos extra</option><option>Otro</option></select></div>
<div class="field"><label>Importe</label><input id="editAmount" inputmode="numeric" required></div>
<div class="field"><label>Detalle</label><input id="editDetail"></div>
<div class="field"><label>Pagó</label><select id="editPaidBy"><option>Rocío</option><option>Toto</option></select></div>
</div>
<p><button class="btn">Guardar cambios</button> <button type="button" id="cancelEdit" class="delete">Cancelar</button></p>
</form>
<div id="editMsg"></div>
</section>
<section class="panel">
<h2 id="historyTitle">Gastos cargados <span id="count"></span></h2>
<div id="list"></div>
<hr>
<b>Total de gastos del mes: <span id="total">$0</span></b>
</section>

<section class="panel">
<h2>Mes</h2>
<form id="monthForm" style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap">
<button type="button" id="prevMonth" class="btn">← Anterior</button>
<input id="monthPicker" type="month" required>
<button type="button" id="nextMonth" class="btn">Siguiente →</button>
</form>
</section>
</main>
<script src="./supabase.js?v=7"></script>
<script src="./app.js?v=4"></script>
</body>
</html>
